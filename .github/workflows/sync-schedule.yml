name: Sync broadcast schedule

on:
  workflow_dispatch:
    # Allows manual trigger from the GitHub Actions UI
    # This is the "admin trigger" required by the spec

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to git push data/schedule.json back to main

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run scraper
        run: npm run sync

      - name: Commit updated schedule
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/schedule.json
          # Only commit if the file actually changed
          git diff --staged --quiet || git commit -m "chore: sync broadcast schedule $(date -u +%Y-%m-%d)"

      - name: Push
        run: git push

  sync-standings:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run scraper
        run: npm run sync:standings
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}

      - name: Commit updated standings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/standings.json
          git diff --staged --quiet || git commit -m "chore: sync standings [skip ci]"

      - name: Push
        run: |
          git pull --rebase origin main
          git push

# ACTION REQUIRED: add FOOTBALL_DATA_KEY as a GitHub Actions secret
# Settings → Secrets and variables → Actions → New repository secret
